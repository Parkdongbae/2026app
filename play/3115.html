                    <!-- 클래스카드 핵심 3단계 달성 배지 (암기 / 리콜 / 스펠) -->
                    <div class="grid grid-cols-3 gap-1.5 pt-1">
                      <div class="px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 text-center">
                        <span class="text-[10px] font-bold text-slate-400 block">암기</span>
                        <span class="text-xs font-black ${stats.memoPct === 100 ? 'text-emerald-600' : 'text-blue-600 dark:text-blue-400'}">${stats.memoPct}%</span>
                      </div>
                      <div class="px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 text-center">
                        <span class="text-[10px] font-bold text-slate-400 block">리콜</span>
                        <span class="text-xs font-black ${stats.recallPct === 100 ? 'text-emerald-600' : 'text-amber-500'}">${stats.recallPct}%</span>
                      </div>
                      <div class="px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 text-center">
                        <span class="text-[10px] font-bold text-slate-400 block">스펠</span>
                        <span class="text-xs font-black ${stats.spellPct === 100 ? 'text-emerald-600' : 'text-purple-600 dark:text-purple-400'}">${stats.spellPct}%</span>
                      </div>
                    </div>

                    <div class="pt-1 flex items-center justify-between text-xs font-extrabold text-blue-600 dark:text-blue-400">
                      <span>세트 열기</span>
                      <span class="w-7 h-7 rounded-full bg-blue-50 dark:bg-blue-950 flex items-center justify-center"><i class="fa-solid fa-arrow-right"></i></span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       6. 화면 ②: 클래스카드 세트 학습방 (상단 모드 런처 + 학습 스테이지)
       ========================================================================== */
    function getSetTitle(setId) {
      const found = SETS_META.find(m => m.id === setId);
      if (found) return found.title;
      if (setId === 'starred') return '⭐ 별표 단어 세트';
      if (setId === 'wrong') return '🚨 오답 집중 세트';
      if (setId === 'custom') return '📗 나만의 단어장 세트';
      return '📚 전체 120+ 단어 통합 세트';
    }

    function renderSetWorkspace(container) {
      const words = getSetWords(ui.activeSetId);
      const stats = getSetProgressStats(words);

      const tabs = [
        { id: 'list', label: '단어 목록', icon: 'fa-list-ul', color: 'slate', pct: null },
        { id: 'memo', label: '1. 암기', icon: 'fa-clone', color: 'blue', pct: stats.memoPct },
        { id: 'recall', label: '2. 리콜', icon: 'fa-bolt', color: 'amber', pct: stats.recallPct },
        { id: 'spell', label: '3. 스펠', icon: 'fa-keyboard', color: 'purple', pct: stats.spellPct },
        { id: 'test', label: '실전 테스트', icon: 'fa-file-signature', color: 'rose', pct: null },
        { id: 'matching', label: '매칭 게임', icon: 'fa-puzzle-piece', color: 'emerald', pct: null }
      ];

      container.innerHTML = `
        <div class="space-y-5 animate-fade-in">
          <!-- 세트 헤더 & 뒤로가기 -->
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <button onclick="goHome()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 transition" title="세트 목록으로">
                  <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div>
                  <h2 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white">${getSetTitle(ui.activeSetId)}</h2>
                  <p class="text-xs text-slate-500 dark:text-slate-400">총 <strong>${words.length}</strong>단어 · 종합 달성률 <strong class="text-blue-600 dark:text-blue-400">${stats.totalPct}%</strong></p>
                </div>
              </div>

              ${ui.activeSetId === 'custom' ? `
                <button onclick="openModal('modal-add-word')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold transition">
                  + 단어 추가하기
                </button>
              ` : ''}
            </div>

            <!-- 클래스카드식 6대 학습 런처 버튼 바 -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
              ${tabs.map(t => {
                const active = ui.setTab === t.id;
                const activeStyles = {
                  slate: 'bg-slate-800 text-white border-slate-800 dark:bg-slate-700',
                  blue: 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/25',
                  amber: 'bg-amber-500 text-white border-amber-500 shadow-sm shadow-amber-500/25',
                  purple: 'bg-purple-600 text-white border-purple-600 shadow-sm shadow-purple-500/25',
                  rose: 'bg-rose-600 text-white border-rose-600 shadow-sm shadow-rose-500/25',
                  emerald: 'bg-emerald-600 text-white border-emerald-600 shadow-sm shadow-emerald-500/25'
                }[t.color];

                return `
                  <button onclick="switchSetTab('${t.id}')" class="py-2.5 px-3 rounded-2xl border text-left transition flex items-center justify-between ${active ? activeStyles : 'bg-slate-50 hover:bg-slate-100 dark:bg-slate-800/70 dark:hover:bg-slate-800 border-slate-200/80 dark:border-slate-700 text-slate-700 dark:text-slate-200'}">
                    <div class="flex items-center gap-2">
                      <i class="fa-solid ${t.icon} text-xs ${active ? 'text-white' : `text-${t.color}-500`}"></i>
                      <span class="text-xs sm:text-sm font-extrabold">${t.label}</span>
                    </div>
                    ${t.pct !== null ? `<span class="text-[11px] font-black ${active ? 'text-white/90' : 'text-slate-400'}">${t.pct}%</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 선택된 탭 스테이지 -->
          <div id="set-stage"></div>
        </div>
      `;

      const stage = document.getElementById('set-stage');
      if (words.length === 0) {
        stage.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-12 border border-slate-200 dark:border-slate-800 text-center space-y-3">
            <i class="fa-regular fa-folder-open text-4xl text-slate-300"></i>
            <h3 class="text-base font-extrabold text-slate-800 dark:text-slate-100">이 세트에는 아직 단어가 없습니다</h3>
            <p class="text-xs text-slate-500">다른 학습 세트를 선택하거나 새 단어를 추가해 보세요.</p>
            <button onclick="goHome()" class="mt-2 px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold">홈으로 돌아가기</button>
          </div>
        `;
        return;
      }

      if (ui.setTab === 'list') renderWordListTab(stage, words);
      else if (ui.setTab === 'memo') renderMemorizeTab(stage, words);
      else if (ui.setTab === 'recall') renderRecallTab(stage, words);
      else if (ui.setTab === 'spell') renderSpellTab(stage, words);
      else if (ui.setTab === 'test') renderTestTab(stage, words);
      else if (ui.setTab === 'matching') renderMatchingTab(stage, words);
    }

    /* --------------------------------------------------------------------------
       6-1. 탭 ①: 단어 목록 & 클래스카드식 가림막(단어 / 뜻 / 발음 가리기)
       -------------------------------------------------------------------------- */
    function renderWordListTab(stage, words) {
      let filtered = words;
      if (ui.listSearch.trim()) {
        const q = ui.listSearch.trim().toLowerCase();
        filtered = words.filter(w =>
          w.word.toLowerCase().includes(q) ||
          w.meaning.toLowerCase().includes(q) ||
          (w.koPron && w.koPron.includes(q))
        );
      }

      stage.innerHTML = `
        <div class="space-y-4">
          <!-- 가림막 컨트롤 & 검색 바 -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-extrabold text-slate-500 mr-1"><i class="fa-solid fa-eye-slash text-blue-600 mr-1"></i>가림막:</span>
              ${[
                { id: 'none', label: '모두 보기' },
                { id: 'meaning', label: '뜻 가리기' },
                { id: 'word', label: '영어 가리기' },
                { id: 'pron', label: '한글발음 가리기' }
              ].map(b => `
                <button onclick="ui.blindMode='${b.id}'; renderSetWorkspace(document.getElementById('app-main'))" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${ui.blindMode === b.id ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">
                  ${b.label}
                </button>
              `).join('')}
            </div>

            <div class="relative w-full sm:w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="set-list-search" value="${ui.listSearch}" oninput="ui.listSearch=this.value; renderSetWorkspace(document.getElementById('app-main'))" placeholder="세트 내 단어/발음 검색..." class="w-full pl-8 pr-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <!-- 단어 카드 리스트 -->
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden shadow-2xs">
            ${filtered.map((w, idx) => {
              const st = getStatus(w.id);
              const isStar = state.starredIds.includes(w.id);
              const memoBadge = st.memo >= 3
                ? '<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400 text-[10px] font-extrabold">암기완료</span>'
                : st.memo > 0
                  ? '<span class="px-2 py-0.5 rounded bg-amber-50 text-amber-600 dark:bg-amber-950 dark:text-amber-400 text-[10px] font-extrabold">학습중</span>'
                  : '';

              return `
                <div onclick="openWordDetail('${w.id}')" class="p-4 sm:px-6 hover:bg-slate-50/90 dark:hover:bg-slate-800/50 transition cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <!-- 좌측: 번호 + 영단어 + 발음기호 + 한글발음 -->
                  <div class="sm:w-5/12 flex items-start gap-3">
                    <span class="text-xs font-bold text-slate-400 mt-1.5 w-5">${idx + 1}</span>
                    <div>
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-lg sm:text-xl font-black text-slate-900 dark:text-white ${ui.blindMode === 'word' ? 'blind-blur' : ''}">${w.word}</span>
                        <button onclick="speakText('${w.word.replace(/'/g, "\\'")}', event)" class="w-7 h-7 rounded-full bg-blue-50 hover:bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-300 flex items-center justify-center text-xs transition" title="발음 듣기">
                          <i class="fa-solid fa-volume-high"></i>
                        </button>
                        ${memoBadge}
                      </div>
                      <div class="mt-0.5 ${ui.blindMode === 'pron' ? 'blind-blur' : ''}">
                        ${renderPronHTML(w, false)}
                      </div>
                    </div>
                  </div>

                  <!-- 중앙: 품사 + 한글 뜻 + 예문 -->
                  <div class="sm:w-6/12 pl-8 sm:pl-0">
                    <p class="text-sm sm:text-base font-extrabold text-slate-800 dark:text-slate-100 ${ui.blindMode === 'meaning' ? 'blind-blur' : ''}">
                      <span class="text-xs font-bold text-blue-600 dark:text-blue-400 mr-1.5">${w.pos}</span>${w.meaning}
                    </p>
                    ${w.example ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-1">${w.example}</p>` : ''}
                  </div>

                  <!-- 우측: 별표 & 상세 아이콘 -->
                  <div class="flex items-center justify-end gap-2 sm:w-1/12">
                    <button onclick="toggleStar('${w.id}', event)" class="w-8 h-8 rounded-lg hover:bg-slate-200/60 dark:hover:bg-slate-700 flex items-center justify-center text-base ${isStar ? 'text-amber-400' : 'text-slate-300 dark:text-slate-600'}">
                      <i class="fa-${isStar ? 'solid' : 'regular'} fa-star"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      if (ui.listSearch) {
        const inp = document.getElementById('set-list-search');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    }

    /* --------------------------------------------------------------------------
       6-2. 탭 ②: [1단계: 암기] 클래스카드 플래시카드 + 4단계 난이도 평가
       -------------------------------------------------------------------------- */
    function renderMemorizeTab(stage, words) {
      if (ui.cardIndex >= words.length) ui.cardIndex = 0;
      const w = words[ui.cardIndex];
      const isStar = state.starredIds.includes(w.id);

      // 예문 빈칸 처리
      let exampleDisplay = w.example || '';
      if (ui.clozeExampleMode && w.example) {
        const regex = new RegExp(w.word, 'gi');
        exampleDisplay = w.example.replace(regex, '<span class="px-2 py-0.5 rounded bg-amber-400/30 text-amber-200 font-mono font-black">[ ______ ]</span>');
      }

      stage.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-4 animate-fade-in">
          <!-- 상단 진행바 & 예문 빈칸 토글 -->
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-black text-blue-600 dark:text-blue-400">
              암기 카드 ${ui.cardIndex + 1} / ${words.length}
            </span>
            <div class="flex items-center gap-2">
              <button onclick="ui.clozeExampleMode=!ui.clozeExampleMode; renderSetWorkspace(document.getElementById('app-main'));" class="px-3 py-1 rounded-full text-xs font-bold transition ${ui.clozeExampleMode ? 'bg-amber-500 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700'}">
                <i class="fa-solid fa-highlighter mr-1"></i>예문 빈칸 훈련 ${ui.clozeExampleMode ? 'ON' : 'OFF'}
              </button>
            </div>
          </div>

          <!-- 3D 플립 카드 -->
          <div class="perspective-1000 h-96 cursor-pointer select-none" onclick="flipMemoCard()">
            <div id="memo-card-inner" class="relative w-full h-full transform-style-3d ${ui.isFlipped ? 'rotate-y-180' : ''}">
              
              <!-- 앞면: 영단어 + 발음기호 + 한글발음 + 스피커 -->
              <div class="absolute inset-0 backface-hidden bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border-2 border-slate-200 dark:border-slate-800 shadow-lg flex flex-col justify-between">
                <div class="flex items-center justify-between">
                  <span class="px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-300 text-xs font-extrabold">
                    ${w.level === 'custom' ? '내 단어' : `Day ${w.day}`} · ${w.pos}
                  </span>
                  <button onclick="toggleStar('${w.id}', event)" class="w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-xl ${isStar ? 'text-amber-400' : 'text-slate-300 dark:text-slate-600'}">
                    <i class="fa-${isStar ? 'solid' : 'regular'} fa-star"></i>
                  </button>
                </div>

                <div class="text-center my-auto space-y-3">
                  <h3 class="text-4xl sm:text-5xl font-black tracking-tight text-slate-900 dark:text-white break-words">${w.word}</h3>
                  ${renderPronHTML(w, true)}
                  <div class="pt-2">
                    <button onclick="speakText('${w.word.replace(/'/g, "\\'")}', event)" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-extrabold shadow-xs transition">
                      <i class="fa-solid fa-volume-high"></i> 발음 듣기 (${state.settings.voiceAccent === 'en-US' ? 'US' : 'UK'})
                    </button>
                  </div>
                </div>

                <div class="text-center text-xs font-semibold text-slate-400">
                  카드를 클릭하거나 <kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-800 rounded">Space</kbd>를 눌러 뜻과 예문 확인
                </div>
              </div>

              <!-- 뒷면: 한글 뜻 + 예문 + 유의어 + 암기 팁 -->
              <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950 text-white rounded-3xl p-6 sm:p-7 border-2 border-blue-500/30 shadow-xl flex flex-col justify-between overflow-y-auto">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-lg font-black">${w.word}</span>
                    ${(state.settings.showKoPron && w.koPron) ? `<span class="px-2 py-0.5 rounded-full bg-white/15 text-blue-200 text-xs font-extrabold">[${w.koPron}]</span>` : ''}
                    <button onclick="speakText('${w.word.replace(/'/g, "\\'")}', event)" class="w-7 h-7 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-xs">
                      <i class="fa-solid fa-volume-high"></i>
                    </button>
                  </div>
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded bg-white/15">${w.pos}</span>
                </div>

                <div class="my-auto space-y-3 py-2">
                  <div class="text-center">
                    <h3 class="text-2xl sm:text-3xl font-black text-amber-300">${w.meaning}</h3>
                    ${w.subMeanings && w.subMeanings.length ? `<p class="text-xs text-blue-200 mt-1">확장 뜻: ${w.subMeanings.join(' · ')}</p>` : ''}
                  </div>

                  ${w.example ? `
                    <div class="bg-black/25 rounded-2xl p-3.5 space-y-1 text-left">
                      <div class="flex items-start justify-between gap-2">
                        <p class="text-xs sm:text-sm font-semibold text-white leading-relaxed">${exampleDisplay}</p>
                        <button onclick="speakText('${w.example.replace(/'/g, "\\'")}', event)" class="shrink-0 w-6 h-6 rounded bg-white/15 hover:bg-white/25 flex items-center justify-center text-[11px]">
                          <i class="fa-solid fa-volume-low"></i>
                        </button>
                      </div>
                      ${w.exampleKo ? `<p class="text-xs text-blue-200/85">${w.exampleKo}</p>` : ''}
                    </div>
                  ` : ''}

                  ${(w.synonyms && w.synonyms.length) || w.tip ? `
                    <div class="space-y-1.5 text-left text-xs">
                      ${w.synonyms && w.synonyms.length ? `<p class="text-emerald-300 font-bold">유의어: <span class="text-white font-medium">${w.synonyms.join(', ')}</span></p>` : ''}
                      ${w.tip ? `<p class="bg-amber-400/15 border border-amber-300/30 rounded-xl p-2 text-amber-100"><strong class="text-amber-300">💡 팁:</strong> ${w.tip}</p>` : ''}
                    </div>
                  ` : ''}
                </div>
              </div>

            </div>
          </div>

          <!-- 클래스카드식 4단계 난이도 평가 버튼 ([1] 모름, [2] 헷갈림, [3] 앎, [4] 완벽함) -->
          <div class="grid grid-cols-4 gap-2 pt-1">
            <button onclick="rateMemo('${w.id}', 1)" class="py-3 rounded-2xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 flex flex-col items-center justify-center transition">
              <span class="text-xs sm:text-sm font-black">[1] 모름</span>
              <span class="text-[10px] opacity-75">오답 자동등록</span>
            </button>
            <button onclick="rateMemo('${w.id}', 2)" class="py-3 rounded-2xl bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-300 flex flex-col items-center justify-center transition">
              <span class="text-xs sm:text-sm font-black">[2] 헷갈림</span>
              <span class="text-[10px] opacity-75">다시 확인</span>
            </button>
            <button onclick="rateMemo('${w.id}', 3)" class="py-3 rounded-2xl bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/50 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 flex flex-col items-center justify-center transition">
              <span class="text-xs sm:text-sm font-black">[3] 앎</span>
              <span class="text-[10px] opacity-75">암기 달성</span>
            </button>
            <button onclick="rateMemo('${w.id}', 4)" class="py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm flex flex-col items-center justify-center transition">
              <span class="text-xs sm:text-sm font-black">[4] 완벽함</span>
              <span class="text-[10px] text-emerald-100">완벽 마스터</span>
            </button>
          </div>

          <!-- 하단 이전/다음 & 리콜 단계 이동 유도 -->
          <div class="flex items-center justify-between pt-2">
            <button onclick="stepMemo(-1)" class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">
              <i class="fa-solid fa-chevron-left mr-1"></i>이전 카드
            </button>
            <button onclick="switchSetTab('recall')" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-extrabold shadow-xs transition">
              다음 단계: 2. 리콜 학습 <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
            <button onclick="stepMemo(1)" class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">
              다음 카드<i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
          </div>
        </div>
      `;
    }

    function flipMemoCard() {
      ui.isFlipped = !ui.isFlipped;
      document.getElementById('memo-card-inner')?.classList.toggle('rotate-y-180', ui.isFlipped);
    }

    function rateMemo(wordId, level) {
      updateWordStatus(wordId, { memo: level }, level === 1);
      stepMemo(1);
    }

    function stepMemo(delta) {
      const words = getSetWords(ui.activeSetId);
      if (!words.length) return;
      ui.cardIndex = (ui.cardIndex + delta + words.length) % words.length;
      ui.isFlipped = false;
      renderSetWorkspace(document.getElementById('app-main'));
    }

    /* --------------------------------------------------------------------------
       6-3. 탭 ③: [2단계: 리콜] 제한시간 타이머 게이지 4지선다 스피드 퀴즈
       -------------------------------------------------------------------------- */
    function renderRecallTab(stage, words) {
      if (ui.recallIndex >= words.length) {
        // 리콜 완주 화면
        clearTimers();
        stage.innerHTML = `
          <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-lg text-center space-y-4 animate-fade-in">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 dark:bg-amber-950 text-amber-500 flex items-center justify-center mx-auto text-3xl">
              <i class="fa-solid fa-bolt"></i>
            </div>
            <h3 class="text-2xl font-black text-slate-900 dark:text-white">2단계 리콜 학습 완료!</h3>
            <p class="text-sm text-slate-500">총 ${words.length}문제 중 <strong class="text-amber-500 text-lg">${ui.recallScore}문제</strong> 정답!</p>
            <div class="pt-3 flex flex-col gap-2">
              <button onclick="switchSetTab('spell')" class="w-full py-3.5 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-sm shadow-md transition">
                다음 단계: 3. 스펠 학습 도전하기 <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
              <button onclick="ui.recallIndex=0; ui.recallScore=0; resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="w-full py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs">
                리콜 처음부터 다시 풀기
              </button>
            </div>
          </div>
        `;
        return;
      }

      const w = words[ui.recallIndex];
      const isEn2Ko = ui.recallDirection === 'en2ko';

      if (ui.recallOptions.length === 0) {
        const all = getAllWords();
        const distractors = all
          .filter(item => item.id !== w.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3)
          .map(item => ({ label: isEn2Ko ? item.meaning : item.word, isCorrect: false }));
        ui.recallOptions = [{ label: isEn2Ko ? w.meaning : w.word, isCorrect: true }, ...distractors].sort(() => Math.random() - 0.5);

        // 타이머 게이지 시작 (8초)
        ui.recallTimeLeft = 100;
        clearTimers();
        ui.recallTimerId = setInterval(() => {
          ui.recallTimeLeft -= 1.25;
          const bar = document.getElementById('recall-timer-bar');
          if (bar) bar.style.width = `${Math.max(0, ui.recallTimeLeft)}%`;
          if (ui.recallTimeLeft <= 0) {
            clearTimers();
            handleRecallAnswer('TIMEOUT', false);
          }
        }, 100);
      }

      stage.innerHTML = `
        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-sm space-y-5 animate-fade-in">
          <!-- 상단 타이머 게이지 -->
          <div class="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
            <div id="recall-timer-bar" class="h-full bg-gradient-to-r from-amber-400 to-rose-500 transition-all duration-100" style="width: ${ui.recallTimeLeft}%"></div>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-amber-500">리콜 ${ui.recallIndex + 1} / ${words.length}</span>
            <button onclick="ui.recallDirection = ui.recallDirection==='en2ko'?'ko2en':'en2ko'; resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">
              <i class="fa-solid fa-repeat mr-1"></i>${isEn2Ko ? '영단어 → 뜻' : '뜻 → 영단어'}
            </button>
          </div>

          <!-- 제시어 -->
          <div class="text-center py-6 px-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70">
            <h3 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white break-words">
              ${isEn2Ko ? w.word : w.meaning}
            </h3>
            ${isEn2Ko ? `
              <div class="mt-2 flex items-center justify-center gap-2">
                ${renderPronHTML(w, false)}
                <button onclick="speakText('${w.word.replace(/'/g, "\\'")}', event)" class="w-7 h-7 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-600 flex items-center justify-center text-xs">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
              </div>
            ` : `<span class="text-xs font-bold text-slate-400 mt-1 block">${w.pos}</span>`}
          </div>

          <!-- 4지선다 보기 -->
          <div class="space-y-2.5">
            ${ui.recallOptions.map((opt, idx) => {
              let cls = 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-amber-500 text-slate-800 dark:text-slate-100';
              if (ui.recallAnswered) {
                if (opt.isCorrect) cls = 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500 text-emerald-700 dark:text-emerald-300';
                else if (opt.label === ui.recallSelected) cls = 'bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-700 dark:text-rose-300 animate-shake';
                else cls = 'opacity-45 border-slate-200 dark:border-slate-800';
              }
              return `
                <button ${ui.recallAnswered ? 'disabled' : ''} onclick="handleRecallAnswer('${opt.label.replace(/'/g, "\\'")}', ${opt.isCorrect})" class="w-full p-4 rounded-2xl border-2 text-left font-extrabold text-sm sm:text-base transition flex items-center gap-3 ${cls}">
                  <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-black flex items-center justify-center text-slate-500">${idx + 1}</span>
                  <span class="flex-1">${opt.label}</span>
                </button>
              `;
            }).join('')}
          </div>

          ${ui.recallAnswered ? `
            <div class="pt-1 animate-fade-in">
              <button onclick="ui.recallIndex++; resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="w-full py-3.5 rounded-2xl bg-slate-900 dark:bg-amber-500 text-white font-extrabold text-sm">
                다음 문제 <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function handleRecallAnswer(label, isCorrect) {
      if (ui.recallAnswered) return;
      clearTimers();
      const w = getSetWords(ui.activeSetId)[ui.recallIndex];
      ui.recallAnswered = true;
      ui.recallSelected = label;

      if (isCorrect) {
        ui.recallScore += 1;
        updateWordStatus(w.id, { recall: true }, false);
        speakText(w.word);
        renderSetWorkspace(document.getElementById('app-main'));
        setTimeout(() => {
          if (ui.setTab === 'recall' && ui.recallAnswered) {
            ui.recallIndex++;
            resetModeSubStates();
            renderSetWorkspace(document.getElementById('app-main'));
          }
        }, 750);
      } else {
        updateWordStatus(w.id, { recall: false }, true);
        renderSetWorkspace(document.getElementById('app-main'));
      }
    }

    /* --------------------------------------------------------------------------
       6-4. 탭 ④: [3단계: 스펠] 한글 뜻·예문 빈칸·발음 듣고 스펠링 타이핑
       -------------------------------------------------------------------------- */
    function renderSpellTab(stage, words) {
      if (ui.spellIndex >= words.length) {
        stage.innerHTML = `
          <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-lg text-center space-y-4 animate-fade-in">
            <div class="w-16 h-16 rounded-2xl bg-purple-100 dark:bg-purple-950 text-purple-600 flex items-center justify-center mx-auto text-3xl">
              <i class="fa-solid fa-award"></i>
            </div>
            <h3 class="text-2xl font-black text-slate-900 dark:text-white">3단계 스펠 학습 완주!</h3>
            <p class="text-sm text-slate-500">암기 · 리콜 · 스펠 3단계 완전학습 사이클을 마쳤습니다!</p>
            <div class="pt-3 flex flex-col gap-2">
              <button onclick="switchSetTab('test')" class="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm shadow-md transition">
                실전 종합 테스트 응시하기 <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
              <button onclick="ui.spellIndex=0; resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="w-full py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs">
                스펠 다시 연습하기
              </button>
            </div>
          </div>
        `;
        return;
      }

      const w = words[ui.spellIndex];
      let clozeEx = '';
      if (w.example) {
        const rx = new RegExp(w.word, 'gi');
        clozeEx = w.example.replace(rx, '<span class="px-2 py-0.5 rounded bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300 font-mono font-bold">______</span>');
      }

      stage.innerHTML = `
        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-sm space-y-5 animate-fade-in">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-purple-600 dark:text-purple-400">스펠 ${ui.spellIndex + 1} / ${words.length}</span>
            <div class="flex items-center gap-1.5">
              <button onclick="ui.spellHintShown=true; renderSetWorkspace(document.getElementById('app-main'));" class="px-3 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 text-xs font-bold">
                <i class="fa-solid fa-lightbulb mr-1"></i>첫 글자 힌트
              </button>
              <button onclick="speakText('${w.word.replace(/'/g, "\\'")}', event)" class="px-3 py-1.5 rounded-xl bg-purple-50 dark:bg-purple-950/60 text-purple-600 dark:text-purple-300 text-xs font-bold">
                <i class="fa-solid fa-volume-high mr-1"></i>발음 힌트
              </button>
            </div>
          </div>

          <div class="text-center py-6 px-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 space-y-2.5">
            <span class="px-2.5 py-0.5 rounded bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300 text-xs font-bold">${w.pos}</span>
            <h3 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">${w.meaning}</h3>
            ${clozeEx ? `<p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 pt-1">"${clozeEx}"</p>` : ''}
            <p class="text-xs font-mono font-bold text-slate-400">
              ${ui.spellHintShown ? `힌트: ${w.word[0]}${' _'.repeat(w.word.length - 1)} (${w.word.length}글자)` : `철자 수: ${w.word.length}글자`}
            </p>
          </div>

          <form onsubmit="submitSpellAnswer(event)" class="space-y-3">
            <input
              type="text"
              id="spell-typing-input"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              ${ui.spellAnswered ? 'disabled' : ''}
              value="${ui.spellInput}"
              placeholder="영단어 스펠링을 입력하세요"
              class="w-full px-4 py-4 rounded-2xl text-center text-xl font-black tracking-wider bg-slate-50 dark:bg-slate-800 border-2 ${
                !ui.spellAnswered
                  ? 'border-slate-200 dark:border-slate-700 focus:border-purple-500'
                  : ui.spellCorrect
                    ? 'border-emerald-500 text-emerald-600'
                    : 'border-rose-500 text-rose-600'
              } focus:outline-none"
            >

            ${!ui.spellAnswered ? `
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-sm shadow-md transition">
                정답 확인
              </button>
            ` : `
              <div class="p-4 rounded-2xl ${ui.spellCorrect ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-200' : 'bg-rose-50 dark:bg-rose-950/50 text-rose-800 dark:text-rose-200'} space-y-2.5 animate-fade-in">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-black">${ui.spellCorrect ? '🎯 완벽한 스펠링입니다!' : `❌ 정답: ${w.word}`}</span>
                  ${renderPronHTML(w, false)}
                </div>
                <button type="button" onclick="ui.spellIndex++; resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="w-full py-3 rounded-xl bg-slate-900 dark:bg-purple-600 text-white font-bold text-sm">
                  다음 단어 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
              </div>
            `}
          </form>
        </div>
      `;

      if (!ui.spellAnswered) {
        setTimeout(() => document.getElementById('spell-typing-input')?.focus(), 40);
      }
    }

    function submitSpellAnswer(e) {
      e.preventDefault();
      if (ui.spellAnswered) return;
      const val = document.getElementById('spell-typing-input')?.value.trim() || '';
      if (!val) { showToast('스펠링을 입력해 주세요!', 'warning'); return; }
      const w = getSetWords(ui.activeSetId)[ui.spellIndex];
      const ok = val.toLowerCase() === w.word.toLowerCase();
      ui.spellAnswered = true;
      ui.spellInput = val;
      ui.spellCorrect = ok;
      updateWordStatus(w.id, { spell: ok }, !ok);
      if (ok) speakText(w.word);
      renderSetWorkspace(document.getElementById('app-main'));
    }

    /* --------------------------------------------------------------------------
       6-5. 탭 ⑤: 실전 종합 테스트 (객관식 + 주관식 혼합 시험 및 성적표)
       -------------------------------------------------------------------------- */
    function renderTestTab(stage, words) {
      if (ui.testQueue.length === 0) {
        const shuffled = [...words].sort(() => Math.random() - 0.5).slice(0, Math.min(10, words.length));
        const all = getAllWords();
        ui.testQueue = shuffled.map((w, i) => {
          const mode = i % 2 === 0 ? 'choice' : 'typing';
          const distractors = all.filter(x => x.id !== w.id).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.meaning);
          const options = [w.meaning, ...distractors].sort(() => Math.random() - 0.5);
          return { wordObj: w, mode, options };
        });
        ui.testIndex = 0;
        ui.testAnswers = [];
        ui.testFinished = false;
      }

      if (ui.testFinished) {
        const correctCnt = ui.testAnswers.filter(a => a.isCorrect).length;
        const score = Math.round((correctCnt / ui.testQueue.length) * 100);
        if (score >= 80 && typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });

        stage.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-lg space-y-6 animate-fade-in">
            <div class="text-center space-y-2">
              <span class="px-3 py-1 rounded-full bg-rose-50 dark:bg-rose-950 text-rose-600 text-xs font-extrabold">실전 종합 테스트 결과</span>
              <h3 class="text-4xl font-black text-slate-900 dark:text-white">${score}점</h3>
              <p class="text-xs text-slate-500">총 ${ui.testQueue.length}문항 중 <strong>${correctCnt}문항</strong> 정답 (오답은 오답 노트에 자동 저장됨)</p>
            </div>

            <div class="divide-y divide-slate-100 dark:divide-slate-800 border-t border-b border-slate-100 dark:border-slate-800 max-h-80 overflow-y-auto">
              ${ui.testAnswers.map((ans, idx) => `
                <div class="py-3 flex items-center justify-between gap-3 text-xs sm:text-sm">
                  <div>
                    <span class="font-black mr-2 ${ans.isCorrect ? 'text-emerald-600' : 'text-rose-500'}">${ans.isCorrect ? 'O' : 'X'}</span>
                    <strong class="text-slate-900 dark:text-white">${ans.wordObj.word}</strong>
                    <span class="text-slate-400 ml-1">(${ans.wordObj.meaning})</span>
                  </div>
                  <span class="text-xs ${ans.isCorrect ? 'text-slate-400' : 'text-rose-500 font-bold'}">내 답: ${ans.userAnswer || '(미입력)'}</span>
                </div>
              `).join('')}
            </div>

            <button onclick="resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm">
              새 시험지로 재응시하기
            </button>
          </div>
        `;
        return;
      }

      const item = ui.testQueue[ui.testIndex];
      const w = item.wordObj;

      stage.innerHTML = `
        <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-sm space-y-5 animate-fade-in">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-rose-600">실전 테스트 ${ui.testIndex + 1} / ${ui.testQueue.length}</span>
            <span class="px-2.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-500">${item.mode === 'choice' ? '객관식' : '주관식 스펠링'}</span>
          </div>

          <div class="text-center py-6 px-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70">
            <h3 class="text-3xl font-black text-slate-900 dark:text-white">${item.mode === 'choice' ? w.word : w.meaning}</h3>
            <p class="text-xs text-slate-400 mt-1">${item.mode === 'choice' ? (w.phonetic || w.pos) : `${w.pos} · ${w.word.length}글자`}</p>
          </div>

          ${item.mode === 'choice' ? `
            <div class="space-y-2.5">
              ${item.options.map((opt, idx) => `
                <button onclick="recordTestAnswer('${opt.replace(/'/g, "\\'")}', ${opt === w.meaning})" class="w-full p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-rose-500 text-left font-bold text-sm sm:text-base transition flex items-center gap-3">
                  <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                  <span>${opt}</span>
                </button>
              `).join('')}
            </div>
          ` : `
            <form onsubmit="submitTestTyping(event)" class="space-y-3">
              <input type="text" id="test-typing-box" required autocomplete="off" placeholder="영단어 철자를 입력하세요" class="w-full px-4 py-4 rounded-2xl text-center text-xl font-black bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 focus:border-rose-500 focus:outline-none">
              <button type="submit" class="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm">제출 및 다음 문항</button>
            </form>
          `}
        </div>
      `;

      if (item.mode === 'typing') {
        setTimeout(() => document.getElementById('test-typing-box')?.focus(), 40);
      }
    }

    function submitTestTyping(e) {
      e.preventDefault();
      const val = document.getElementById('test-typing-box')?.value.trim() || '';
      const w = ui.testQueue[ui.testIndex].wordObj;
      recordTestAnswer(val, val.toLowerCase() === w.word.toLowerCase());
    }

    function recordTestAnswer(userAnswer, isCorrect) {
      const w = ui.testQueue[ui.testIndex].wordObj;
      ui.testAnswers.push({ wordObj: w, userAnswer, isCorrect });
      if (!isCorrect) updateWordStatus(w.id, {}, true);
      else updateWordStatus(w.id, { recall: true }, false);

      if (ui.testIndex + 1 >= ui.testQueue.length) {
        ui.testFinished = true;
      } else {
        ui.testIndex += 1;
      }
      renderSetWorkspace(document.getElementById('app-main'));
    }

    /* --------------------------------------------------------------------------
       6-6. 탭 ⑥: 스피드 매칭 게임 (6쌍 카드 짝맞추기)
       -------------------------------------------------------------------------- */
    function renderMatchingTab(stage, words) {
      if (ui.matchCards.length === 0) {
        const sample = [...words].sort(() => Math.random() - 0.5).slice(0, Math.min(6, words.length));
        const cards = [];
        sample.forEach(w => {
          cards.push({ uid: `${w.id}_en`, wordId: w.id, text: w.word, type: 'en' });
          cards.push({ uid: `${w.id}_ko`, wordId: w.id, text: w.meaning, type: 'ko' });
        });
        ui.matchCards = cards.sort(() => Math.random() - 0.5);
        ui.matchSelected = [];
        ui.matchMatchedIds = [];
        ui.matchStartTime = Date.now();
        ui.matchElapsed = '0.0';

        clearTimers();
        ui.matchTimerId = setInterval(() => {
          ui.matchElapsed = ((Date.now() - ui.matchStartTime) / 1000).toFixed(1);
          const el = document.getElementById('match-clock');
          if (el) el.textContent = `${ui.matchElapsed}초`;
        }, 100);
      }

      const pairs = ui.matchCards.length / 2;
      if (ui.matchMatchedIds.length === pairs) {
        clearTimers();
        const sec = parseFloat(ui.matchElapsed);
        let bestMsg = '';
        if (state.bestMatchTime === null || sec < state.bestMatchTime) {
          state.bestMatchTime = sec;
          bestMsg = '🎉 개인 최고 기록 경신!';
          saveState();
        }
        if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });

        stage.innerHTML = `
          <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-lg text-center space-y-4 animate-fade-in">
            <div class="w-16 h-16 rounded-2xl bg-emerald-100 dark:bg-emerald-950 text-emerald-500 flex items-center justify-center mx-auto text-3xl">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-2xl font-black text-slate-900 dark:text-white">매칭 클리어!</h3>
            <p class="text-3xl font-black text-emerald-600">${sec}초</p>
            ${bestMsg ? `<span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-extrabold">${bestMsg}</span>` : `<p class="text-xs text-slate-400">최고 기록: ${state.bestMatchTime}초</p>`}
            <button onclick="resetModeSubStates(); renderSetWorkspace(document.getElementById('app-main'));" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm">
              새 판 도전하기
            </button>
          </div>
        `;
        return;
      }

      stage.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-4 animate-fade-in">
          <div class="flex items-center justify-between bg-white dark:bg-slate-900 px-5 py-3 rounded-2xl border border-slate-200 dark:border-slate-800">
            <span class="text-xs font-extrabold text-emerald-600"><i class="fa-solid fa-puzzle-piece mr-1"></i>영단어와 한글 뜻을 짝지으세요 (남은 짝: ${pairs - ui.matchMatchedIds.length}쌍)</span>
            <span id="match-clock" class="text-base font-black font-mono text-rose-500">${ui.matchElapsed}초</span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            ${ui.matchCards.map(c => {
              const matched = ui.matchMatchedIds.includes(c.wordId);
              const selected = ui.matchSelected.some(s => s.uid === c.uid);
              if (matched) {
                return `<div class="h-24 rounded-2xl bg-emerald-50/50 dark:bg-emerald-950/20 border-2 border-emerald-400/30 flex items-center justify-center text-emerald-500"><i class="fa-solid fa-check"></i></div>`;
              }
              return `
                <button onclick="clickMatchCard('${c.uid}')" class="h-24 p-3 rounded-2xl border-2 text-center font-extrabold text-sm sm:text-base transition flex items-center justify-center break-words ${
                  selected
                    ? 'bg-emerald-600 border-emerald-600 text-white scale-[1.03] shadow-md'
                    : c.type === 'en'
                      ? 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-emerald-400 text-slate-900 dark:text-white'
                      : 'bg-blue-50/60 dark:bg-slate-800 border-blue-100 dark:border-slate-700 hover:border-emerald-400 text-slate-700 dark:text-slate-200'
                }">
                  ${c.text}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function clickMatchCard(uid) {
      if (ui.matchSelected.length >= 2) return;
      const card = ui.matchCards.find(c => c.uid === uid);
      if (!card || ui.matchMatchedIds.includes(card.wordId)) return;
      if (ui.matchSelected.some(s => s.uid === uid)) {
        ui.matchSelected = [];
        renderSetWorkspace(document.getElementById('app-main'));
        return;
      }
      if (card.type === 'en') speakText(card.text);
      ui.matchSelected.push(card);

      if (ui.matchSelected.length === 2) {
        const [a, b] = ui.matchSelected;
        if (a.wordId === b.wordId && a.type !== b.type) {
          ui.matchMatchedIds.push(a.wordId);
          updateWordStatus(a.wordId, { recall: true }, false);
          ui.matchSelected = [];
          renderSetWorkspace(document.getElementById('app-main'));
        } else {
          renderSetWorkspace(document.getElementById('app-main'));
          setTimeout(() => {
            ui.matchSelected = [];
            renderSetWorkspace(document.getElementById('app-main'));
          }, 420);
        }
      } else {
        renderSetWorkspace(document.getElementById('app-main'));
      }
    }

    /* ==========================================================================
       7. 단어 심층 상세 모달 & 나만의 단어 추가 / 백업 / 초기화
       ========================================================================== */
    function openWordDetail(wordId) {
      const w = getAllWords().find(x => x.id === wordId);
      if (!w) return;
      const isStar = state.starredIds.includes(w.id);

      document.getElementById('modal-word-detail-body').innerHTML = `
        <div class="space-y-5">
          <div class="flex items-start justify-between gap-3">
            <div>
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold bg-blue-50 text-blue-600 dark:bg-blue-950 dark:text-blue-300">
                ${w.level === 'custom' ? '나만의 단어장' : `Day ${w.day} · ${w.level === 'middle' ? '중등 필수' : '고등 핵심'}`}
              </span>
              <div class="flex items-center gap-3 mt-2 flex-wrap">
                <h2 class="text-3xl font-black text-slate-900 dark:text-white">${w.word}</h2>
                ${renderPronHTML(w, false)}
                <button onclick="speakText('${w.word.replace(/'/g, "\\'")}', event)" class="w-9 h-9 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center text-sm shadow-xs">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="toggleStar('${w.id}', event); openWordDetail('${w.id}')" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-lg ${isStar ? 'text-amber-400' : 'text-slate-400'}">
                <i class="fa-${isStar ? 'solid' : 'regular'} fa-star"></i>
              </button>
              <button onclick="closeModal('modal-word-detail')" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 space-y-1.5">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-blue-600 text-white text-xs font-bold">${w.pos}</span>
              <span class="text-xl font-black text-slate-900 dark:text-white">${w.meaning}</span>
            </div>
            ${w.subMeanings && w.subMeanings.length ? `<p class="text-xs text-slate-500">다의어: ${w.subMeanings.join(' · ')}</p>` : ''}
          </div>

          ${w.example ? `
            <div class="p-4 rounded-2xl bg-blue-50/60 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900/50 space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-blue-600 dark:text-blue-400">실전 독해 예문</span>
                <button onclick="speakText('${w.example.replace(/'/g, "\\'")}', event)" class="text-xs font-bold text-blue-600 hover:underline"><i class="fa-solid fa-volume-low mr-1"></i>듣기</button>
              </div>
              <p class="text-sm font-bold text-slate-800 dark:text-slate-100">${w.example}</p>
              ${w.exampleKo ? `<p class="text-xs text-slate-600 dark:text-slate-300">${w.exampleKo}</p>` : ''}
            </div>
          ` : ''}

          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="p-3.5 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/30">
              <span class="font-extrabold text-emerald-700 dark:text-emerald-400 block mb-1">유의어</span>
              <span class="font-bold text-slate-700 dark:text-slate-200">${(w.synonyms && w.synonyms.length) ? w.synonyms.join(', ') : '-'}</span>
            </div>
            <div class="p-3.5 rounded-2xl bg-rose-50/70 dark:bg-rose-950/30">
              <span class="font-extrabold text-rose-700 dark:text-rose-400 block mb-1">반의어</span>
              <span class="font-bold text-slate-700 dark:text-slate-200">${(w.antonyms && w.antonyms.length) ? w.antonyms.join(', ') : '-'}</span>
            </div>
          </div>

          ${w.derivatives ? `<div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 text-xs"><strong class="text-slate-500 block mb-0.5">파생어 확장</strong><span class="font-bold">${w.derivatives}</span></div>` : ''}
          ${w.tip ? `<div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200/70 text-xs text-amber-900 dark:text-amber-100"><strong class="text-amber-700 dark:text-amber-300">💡 어원 & 암기 팁:</strong> ${w.tip}</div>` : ''}
        </div>
      `;
      openModal('modal-word-detail');
    }

    function handleAddCustomWord(e) {
      e.preventDefault();
      const word = document.getElementById('add-word-en').value.trim();
      const pos = document.getElementById('add-word-pos').value;
      const meaning = document.getElementById('add-word-ko').value.trim();
      const koPron = document.getElementById('add-word-kopron').value.trim();
      const example = document.getElementById('add-word-ex').value.trim();
      const exampleKo = document.getElementById('add-word-exko').value.trim();
      const tip = document.getElementById('add-word-tip').value.trim();
      if (!word || !meaning) return;

      state.customWords.unshift({
        id: 'cust_' + Date.now(),
        level: 'custom', day: 0,
        word, pos, meaning, phonetic: '', koPron, subMeanings: [],
        example, exampleKo, synonyms: [], antonyms: [], derivatives: '', tip
      });
      saveState();
      e.target.reset();
      closeModal('modal-add-word');
      showToast(`'${word}' 단어가 나만의 단어장에 추가되었습니다!`, 'success');
      renderApp();
    }

    function openModal(id) {
      const m = document.getElementById(id);
      if (!m) return;
      m.classList.remove('hidden');
      m.classList.add('flex');
      if (id === 'modal-settings') syncSettingsModal();
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      if (!m) return;
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function syncSettingsModal() {
      const ko = document.getElementById('modal-kopron-toggle');
      const us = document.getElementById('modal-us');
      const uk = document.getElementById('modal-uk');
      const rt = document.getElementById('modal-rate');
      if (ko) {
        ko.textContent = state.settings.showKoPron ? 'ON' : 'OFF';
        ko.className = state.settings.showKoPron
          ? 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white'
          : 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300';
      }
      if (us && uk) {
        us.className = state.settings.voiceAccent === 'en-US'
          ? 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-blue-600 text-white'
          : 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300';
        uk.className = state.settings.voiceAccent === 'en-GB'
          ? 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-blue-600 text-white'
          : 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300';
      }
      if (rt) rt.textContent = `${state.settings.voiceRate.toFixed(1)}x`;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VocaCard_Backup_${getTodayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('학습 진도 파일이 다운로드되었습니다.', 'success');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && parsed.wordStatus) {
            state = { ...state, ...parsed };
            saveState();
            applyTheme();
            syncHeaderUI();
            closeModal('modal-settings');
            renderApp();
            showToast('백업 파일이 복원되었습니다!', 'success');
          }
        } catch {
          showToast('잘못된 백업 파일입니다.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function requestResetAll() {
      closeModal('modal-settings');
      const modal = document.getElementById('modal-confirm');
      document.getElementById('confirm-title').textContent = '전체 학습 기록 초기화';
      document.getElementById('confirm-msg').textContent = '모든 세트의 암기·리콜·스펠 진도와 오답 기록이 초기화됩니다. 진행할까요?';
      document.getElementById('confirm-ok').onclick = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        state.wordStatus = {};
        state.dailyHistory = {};
        state.streak = 1;
        state.bestMatchTime = null;
        saveState();
        renderApp();
        showToast('초기화가 완료되었습니다.', 'info');
      };
      document.getElementById('confirm-cancel').onclick = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    /* ==========================================================================
       8. 초기화 및 키보드 단축키 바인딩
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();

      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement.tagName.toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (!document.getElementById('modal-word-detail').classList.contains('hidden')) return;
        if (!document.getElementById('modal-add-word').classList.contains('hidden')) return;
        if (!document.getElementById('modal-settings').classList.contains('hidden')) return;

        if (ui.view === 'set') {
          const words = getSetWords(ui.activeSetId);
          if (ui.setTab === 'memo' && words[ui.cardIndex]) {
            const w = words[ui.cardIndex];
            if (e.code === 'Space') { e.preventDefault(); flipMemoCard(); }
            else if (e.key === '1') rateMemo(w.id, 1);
            else if (e.key === '2') rateMemo(w.id, 2);
            else if (e.key === '3') rateMemo(w.id, 3);
            else if (e.key === '4') rateMemo(w.id, 4);
            else if (e.code === 'ArrowRight') stepMemo(1);
            else if (e.code === 'ArrowLeft') stepMemo(-1);
            else if (e.key.toLowerCase() === 's') speakText(w.word);
          } else if (ui.setTab === 'recall' && !ui.recallAnswered && ['1', '2', '3', '4'].includes(e.key)) {
            const idx = Number(e.key) - 1;
            const opt = ui.recallOptions[idx];
            if (opt) handleRecallAnswer(opt.label, opt.isCorrect);
          }
        }
      });
    });
  </script>
</body>
</html>
