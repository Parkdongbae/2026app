<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocaCard - 예비 고1 클래스카드 스타일 영단어 암기 앱</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
          },
          colors: {
            cc: {
              blue: '#2563eb',
              indigo: '#4f46e5',
              green: '#10b981',
              amber: '#f59e0b',
              purple: '#8b5cf6',
              rose: '#f43f5e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 3D 카드 플립 애니메이션 */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 { transform: rotateY(180deg); }

    /* 클래스카드식 가림막(Blind) 블러 효과 */
    .blind-blur {
      filter: blur(7px);
      user-select: none;
      transition: filter 0.2s ease;
    }
    .blind-blur:hover {
      filter: blur(0px);
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-[#f4f6fa] text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 selection:bg-blue-600 selection:text-white">

  <!-- ========================================================================
       1. 상단 네비게이션 헤더 (클래스카드 스타일 에듀테크 상단 바)
       ======================================================================== -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-2xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <!-- 좌측 로고 및 홈 복귀 -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/25">
          <i class="fa-solid fa-layer-group text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-black text-xl tracking-tight text-slate-900 dark:text-white">Voca<span class="text-blue-600 dark:text-blue-400">Card</span></h1>
            <span class="px-2 py-0.5 text-[11px] font-extrabold bg-blue-50 text-blue-600 dark:bg-blue-950 dark:text-blue-300 border border-blue-200/70 dark:border-blue-800 rounded-md">예비 고1</span>
          </div>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block">암기 → 리콜 → 스펠 3단계 완전학습 단어장</p>
        </div>
      </div>

      <!-- 중앙 오늘의 학습량 & 연속 학습일 -->
      <div class="hidden md:flex items-center gap-4 bg-slate-100/90 dark:bg-slate-800/90 px-4 py-1.5 rounded-full border border-slate-200/70 dark:border-slate-700">
        <div class="flex items-center gap-1.5 text-xs font-extrabold text-orange-500">
          <span>🔥</span>
          <span><span id="hdr-streak">1</span>일 연속</span>
        </div>
        <div class="w-px h-3.5 bg-slate-300 dark:bg-slate-700"></div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-600 dark:text-slate-300">오늘 학습</span>
          <div class="w-24 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
            <div id="hdr-daily-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
          <span class="text-xs font-extrabold text-emerald-600 dark:text-emerald-400"><span id="hdr-daily-count">0</span>/30</span>
        </div>
      </div>

      <!-- 우측 컨트롤 (한글 발음 ON/OFF, 음성 억양/속도, 다크모드, 데이터 관리) -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- 한글 발음 글로벌 토글 -->
        <button id="btn-kopron-toggle" onclick="toggleKoPron()" class="px-2.5 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 border border-indigo-200/80 dark:border-indigo-800 text-xs font-extrabold flex items-center gap-1.5 transition" title="한글 발음 표기 켜기/끄기">
          <i class="fa-solid fa-comment-dots"></i>
          <span class="hidden sm:inline">한글발음</span>
          <span id="hdr-kopron-badge" class="px-1.5 py-0.5 rounded bg-indigo-600 text-white text-[10px]">ON</span>
        </button>

        <!-- US/UK & 속도 -->
        <div class="hidden lg:flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl p-1 text-xs font-bold border border-slate-200/70 dark:border-slate-700">
          <button id="btn-us" onclick="setAccent('en-US')" class="px-2 py-1 rounded-lg bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-300 shadow-2xs transition">US</button>
          <button id="btn-uk" onclick="setAccent('en-GB')" class="px-2 py-1 rounded-lg text-slate-500 dark:text-slate-400 transition">UK</button>
          <div class="w-px h-3 bg-slate-300 dark:bg-slate-600 mx-1"></div>
          <button id="btn-rate" onclick="toggleRate()" class="px-2 py-1 rounded-lg text-slate-600 dark:text-slate-300 hover:text-blue-600 transition">1.0x</button>
        </div>

        <!-- 다크모드 -->
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" title="테마 전환">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
        </button>

        <!-- 설정/백업 -->
        <button onclick="openModal('modal-settings')" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" title="설정 및 백업">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       2. 메인 콘텐츠 영역 (세트 대시보드 <-> 세트 학습방 동적 전환)
       ======================================================================== -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
    <!-- JS로 렌더링됩니다 -->
  </main>

  <!-- 하단 단축키 가이드 푸터 -->
  <footer class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 text-center text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200/70 dark:border-slate-800/70 flex flex-col sm:flex-row items-center justify-between gap-2">
    <div>VocaCard · 예비 고1 필수 중등·고등 영단어 120 완벽 마스터</div>
    <div class="hidden md:flex items-center gap-3">
      <span><kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-800 rounded font-mono">Space</kbd> 카드 뒤집기</span>
      <span><kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-800 rounded font-mono">1~4</kbd> 암기 난이도 / 객관식 선택</span>
      <span><kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-800 rounded font-mono">S</kbd> 원어민 발음 듣기</span>
    </div>
  </footer>

  <!-- 토스트 알림 -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ========================================================================
       3. 모달 다이얼로그 (단어 상세 모달, 나만의 단어 추가 모달, 설정 모달, 확인창)
       ======================================================================== -->
  <!-- 단어 심층 상세 모달 -->
  <div id="modal-word-detail" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4">
    <div id="modal-word-detail-body" class="bg-white dark:bg-slate-900 rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-2xl animate-fade-in"></div>
  </div>

  <!-- 나만의 단어 추가 모달 -->
  <div id="modal-add-word" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl animate-fade-in space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-folder-plus text-blue-600"></i> 나만의 단어장에 추가
        </h3>
        <button onclick="closeModal('modal-add-word')" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleAddCustomWord(event)" class="space-y-3">
        <div class="grid grid-cols-3 gap-2">
          <input type="text" id="add-word-en" required placeholder="영단어 (예: achieve)" class="col-span-2 px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <select id="add-word-pos" class="px-2.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
            <option value="v.">v. 동사</option>
            <option value="n.">n. 명사</option>
            <option value="adj.">adj. 형용사</option>
            <option value="adv.">adv. 부사</option>
            <option value="phr.">phr. 숙어</option>
          </select>
        </div>
        <input type="text" id="add-word-ko" required placeholder="한글 뜻 (예: 성취하다, 달성하다)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="add-word-kopron" placeholder="한글 발음 표기 (예: 어치브)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="add-word-ex" placeholder="영어 예문 (선택)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="add-word-exko" placeholder="예문 해석 (선택)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="add-word-tip" placeholder="유의어 또는 암기 팁 (선택)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-sm transition">
          단어 저장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 설정 및 백업 모달 -->
  <div id="modal-settings" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl animate-fade-in space-y-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-600"></i> 학습 환경 및 데이터 관리
        </h3>
        <button onclick="closeModal('modal-settings')" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 space-y-3">
        <p class="text-xs font-bold text-slate-500 dark:text-slate-400">발음 및 표기 설정</p>
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold">한글 발음 표기 (예: 애드밴티지)</span>
          <button id="modal-kopron-toggle" onclick="toggleKoPron(); syncSettingsModal();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white">ON</button>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold">원어민 억양</span>
          <div class="flex gap-1.5">
            <button id="modal-us" onclick="setAccent('en-US'); syncSettingsModal();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-blue-600 text-white">미국 (US)</button>
            <button id="modal-uk" onclick="setAccent('en-GB'); syncSettingsModal();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">영국 (UK)</button>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold">발음 재생 속도</span>
          <button id="modal-rate" onclick="toggleRate(); syncSettingsModal();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200">1.0x</button>
        </div>
      </div>

      <div class="space-y-2.5">
        <button onclick="exportData()" class="w-full py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between transition">
          <span><i class="fa-solid fa-download text-blue-600 mr-2"></i>학습 진도 백업 다운로드 (JSON)</span>
          <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
        </button>
        <label class="w-full py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between transition cursor-pointer">
          <span><i class="fa-solid fa-upload text-emerald-600 mr-2"></i>백업 파일 불러오기</span>
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
          <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
        </label>
        <button onclick="requestResetAll()" class="w-full py-3 px-4 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/50 text-sm font-bold text-rose-600 dark:text-rose-400 flex items-center justify-between transition">
          <span><i class="fa-solid fa-trash-can mr-2"></i>전체 학습 기록 초기화</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 커스텀 확인창 (alert/confirm 대체) -->
  <div id="modal-confirm" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl animate-fade-in">
      <h4 id="confirm-title" class="text-base font-black text-slate-900 dark:text-white mb-2">확인</h4>
      <p id="confirm-msg" class="text-sm text-slate-600 dark:text-slate-300 mb-5 leading-relaxed"></p>
      <div class="flex justify-end gap-2">
        <button id="confirm-cancel" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300">취소</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white">확인</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 예비 고1 완벽 대비 120단어 데이터베이스 (Day 1~3 중등 60 + Day 4~6 고등 60)
          모든 단어에 직관적인 한글 발음(koPron) 및 유의어·반의어·파생어·암기팁 포함
       ========================================================================== */
    const SETS_META = [
      { id: 'day_1', day: 1, level: 'middle', title: 'Day 01 · 중등 필수 완성 ①', desc: '고교 독해의 기초가 되는 핵심 동사·명사 20선', badge: '중등 필수', color: 'blue' },
      { id: 'day_2', day: 2, level: 'middle', title: 'Day 02 · 중등 필수 완성 ②', desc: '내신 서술형·어법 단골 형용사·동사 20선', badge: '중등 필수', color: 'indigo' },
      { id: 'day_3', day: 3, level: 'middle', title: 'Day 03 · 중등 필수 완성 ③', desc: '중등→고등 연결 고리 및 다의어 총정리 20선', badge: '중등 필수', color: 'violet' },
      { id: 'day_4', day: 4, level: 'high', title: 'Day 04 · 고등 기초·핵심 ①', desc: '고1 3월 학평 1등급 필수 동사·형용사 20선', badge: '고등 핵심', color: 'emerald' },
      { id: 'day_5', day: 5, level: 'high', title: 'Day 05 · 고등 기초·핵심 ②', desc: '모의고사 비문학·인문 지문 빈출 어휘 20선', badge: '고등 핵심', color: 'teal' },
      { id: 'day_6', day: 6, level: 'high', title: 'Day 06 · 고등 기초·핵심 ③', desc: '고난도 빈칸추론·논리 전개 핵심 어휘 20선', badge: '고등 핵심', color: 'rose' }
    ];

    const INITIAL_WORDS = [
      // ==================== DAY 1: 중등 필수 완성 ① (20단어) ====================
      { id: 'd1_01', level: 'middle', day: 1, word: 'achieve', phonetic: '[əˈtʃiːv]', koPron: '어치브', pos: 'v.', meaning: '성취하다, 달성하다', subMeanings: ['(노력 끝에) 이루다', '획득하다'], example: 'You can achieve any goal if you stay consistent.', exampleKo: '꾸준함을 유지한다면 어떤 목표든 성취할 수 있다.', synonyms: ['accomplish', 'attain', 'fulfill'], antonyms: ['fail', 'abandon'], derivatives: 'achievement (n) 성취, 업적 / achievable (adj) 달성 가능한', tip: 'a(방향) + chieve(머리/끝) → 끝까지 도달하여 성취하다!' },
      { id: 'd1_02', level: 'middle', day: 1, word: 'advantage', phonetic: '[ədˈvæntɪdʒ]', koPron: '애드밴티지', pos: 'n.', meaning: '이점, 유리한 점', subMeanings: ['우세', '혜택'], example: 'Being bilingual is a huge advantage in the global job market.', exampleKo: '2개 국어를 구사하는 것은 세계 취업 시장에서 큰 이점이다.', synonyms: ['benefit', 'merit', 'asset'], antonyms: ['disadvantage', 'drawback'], derivatives: 'advantageous (adj) 유리한, 이로운', tip: 'take advantage of (~을 이용하다/활용하다) 숙어와 함께 외우세요.' },
      { id: 'd1_03', level: 'middle', day: 1, word: 'affect', phonetic: '[əˈfekt]', koPron: '어펙트', pos: 'v.', meaning: '~에 영향을 미치다', subMeanings: ['감동시키다', '~인 체하다'], example: 'Lack of sleep directly affects your concentration in class.', exampleKo: '수면 부족은 수업 시간 집중력에 직접적인 영향을 미친다.', synonyms: ['influence', 'impact'], antonyms: [], derivatives: 'affection (n) 애정 / affected (adj) 영향을 받은', tip: 'affect(동사: 영향을 미치다) vs effect(명사: 효과/결과) 구분은 고1 내신 단골!' },
      { id: 'd1_04', level: 'middle', day: 1, word: 'afford', phonetic: '[əˈfɔːrd]', koPron: '어포드', pos: 'v.', meaning: '~할 여유가 되다', subMeanings: ['(시간·비용을) 감당하다', '제공하다'], example: 'High school students cannot afford to waste time on smartphones.', exampleKo: '고등학생들은 스마트폰에 시간을 낭비할 여유가 없다.', synonyms: ['manage', 'bear'], antonyms: [], derivatives: 'affordable (adj) (가격이) 알맞은, 감당할 수 있는', tip: '주로 can/cannot + afford + to부정사 형태로 자주 출제됩니다.' },
      { id: 'd1_05', level: 'middle', day: 1, word: 'appreciate', phonetic: '[əˈpriːʃieɪt]', koPron: '어프리시에이트', pos: 'v.', meaning: '감사하다, 진가를 인정하다', subMeanings: ['(예술 작품을) 감상하다', '제대로 이해하다'], example: 'I truly appreciate your thoughtful advice and support.', exampleKo: '당신의 사려 깊은 조언과 지지에 진심으로 감사드립니다.', synonyms: ['value', 'recognize', 'cherish'], antonyms: ['underestimate', 'neglect'], derivatives: 'appreciation (n) 감사, 감상 / appreciative (adj) 감사하는', tip: 'thank는 사람을 목적어로 취하지만, appreciate는 사물/상황을 목적어로 취합니다!' },
      { id: 'd1_06', level: 'middle', day: 1, word: 'approach', phonetic: '[əˈproʊtʃ]', koPron: '어프로치', pos: 'v./n.', meaning: '접근하다 / 접근법', subMeanings: ['다가오다', '처리하다'], example: 'We need a completely new approach to solve this problem.', exampleKo: '우리는 이 문제를 해결하기 위해 완전히 새로운 접근법이 필요하다.', synonyms: ['method', 'access', 'near'], antonyms: ['retreat', 'withdraw'], derivatives: 'approachable (adj) 접근하기 쉬운, 친근한', tip: '타동사이므로 뒤에 전치사 to를 쓰지 않고 바로 목적어를 씁니다 (approach the station).' },
      { id: 'd1_07', level: 'middle', day: 1, word: 'attitude', phonetic: '[ˈætɪtuːd]', koPron: '애티튜드', pos: 'n.', meaning: '태도, 마음가짐', subMeanings: ['사고방식', '자세'], example: 'A positive attitude turns obstacles into opportunities.', exampleKo: '긍정적인 태도는 장애물을 기회로 바꾼다.', synonyms: ['mindset', 'outlook', 'stance'], antonyms: [], derivatives: 'attitudinal (adj) 태도에 관한', tip: '철자 혼동 주의: attitude(태도) vs altitude(고도, 높이) vs aptitude(적성).' },
      { id: 'd1_08', level: 'middle', day: 1, word: 'available', phonetic: '[əˈveɪləbl]', koPron: '어베일러블', pos: 'adj.', meaning: '이용 가능한, 구할 수 있는', subMeanings: ['(사람이) 시간이 있는'], example: 'This study guide is available for free on our website.', exampleKo: '이 학습 가이드는 우리 웹사이트에서 무료로 이용 가능하다.', synonyms: ['accessible', 'obtainable', 'handy'], antonyms: ['unavailable', 'occupied'], derivatives: 'availability (n) 이용 가능성, 유효성', tip: 'avail(도움이 되다) + able(할 수 있는) → 언제든 써먹을 수 있는!' },
      { id: 'd1_09', level: 'middle', day: 1, word: 'behavior', phonetic: '[bɪˈheɪvjər]', koPron: '비헤이비어', pos: 'n.', meaning: '행동, 태도', subMeanings: ['행실', '(과학) 반응·작용'], example: 'Scientists observed the social behavior of wild dolphins.', exampleKo: '과학자들은 야생 돌고래의 사회적 행동을 관찰했다.', synonyms: ['conduct', 'manner', 'action'], antonyms: ['misconduct'], derivatives: 'behave (v) 행동하다 / behavioral (adj) 행동의', tip: '영국식 철자는 behaviour로 u가 하나 더 들어갑니다.' },
      { id: 'd1_10', level: 'middle', day: 1, word: 'benefit', phonetic: '[ˈbenɪfɪt]', koPron: '베너핏', pos: 'n./v.', meaning: '이익, 혜택 / 이롭다', subMeanings: ['수당', '이득을 얻다'], example: 'Reading books daily brings countless benefits to your brain.', exampleKo: '매일 책을 읽는 것은 뇌에 셀 수 없는 혜택을 가져다준다.', synonyms: ['profit', 'advantage', 'gain'], antonyms: ['harm', 'loss'], derivatives: 'beneficial (adj) 유익한, 이로운', tip: '어근 bene-는 "좋은(good)"이라는 뜻! (beneficial 유익한, benevolent 자애로운)' },
      { id: 'd1_11', level: 'middle', day: 1, word: 'challenge', phonetic: '[ˈtʃælɪndʒ]', koPron: '챌린지', pos: 'n./v.', meaning: '도전, 난제 / 이의를 제기하다', subMeanings: ['과제', '도전하다'], example: 'Entering high school is an exciting new challenge for you.', exampleKo: '고등학교에 입학하는 것은 여러분에게 흥미진진한 새로운 도전이다.', synonyms: ['difficulty', 'task', 'question'], antonyms: ['acceptance'], derivatives: 'challenging (adj) 도전적인, 힘든', tip: 'challenging은 단순히 "어려운"이 아니라 "해볼 만한 가치가 있게 힘든" 뉘앙스!' },
      { id: 'd1_12', level: 'middle', day: 1, word: 'communicate', phonetic: '[kəˈmjuːnɪkeɪt]', koPron: '커뮤니케이트', pos: 'v.', meaning: '의사소통하다, 전달하다', subMeanings: ['교감하다', '(질병을) 전염시키다'], example: 'Effective leaders know how to communicate their vision clearly.', exampleKo: '유능한 리더들은 자신의 비전을 명확히 전달하는 법을 안다.', synonyms: ['convey', 'interact', 'express'], antonyms: ['withhold', 'suppress'], derivatives: 'communication (n) 의사소통 / communicative (adj) 말하기 좋아하는', tip: '어근 commun(공통의) → 생각을 공통으로 나누다 = 의사소통하다.' },
      { id: 'd1_13', level: 'middle', day: 1, word: 'compare', phonetic: '[kəmˈper]', koPron: '컴페어', pos: 'v.', meaning: '비교하다, 비유하다', subMeanings: ['견주다'], example: 'Do not compare your progress with that of others.', exampleKo: '자신의 발전을 다른 사람의 것과 비교하지 마라.', synonyms: ['contrast', 'liken'], antonyms: [], derivatives: 'comparison (n) 비교 / comparative (adj) 비교의, 상대적인', tip: 'compare A with B (A와 B를 비교하다), compare A to B (A를 B에 비유하다).' },
      { id: 'd1_14', level: 'middle', day: 1, word: 'concentrate', phonetic: '[ˈkɑːnsntreɪt]', koPron: '컨센트레이트', pos: 'v.', meaning: '집중하다, 농축하다', subMeanings: ['한곳에 모으다'], example: 'Turn off notifications so you can concentrate on your studies.', exampleKo: '공부에 집중할 수 있도록 알림을 꺼라.', synonyms: ['focus', 'absorb'], antonyms: ['distract', 'scatter'], derivatives: 'concentration (n) 집중력, 농도', tip: 'con(함께) + centr(중심) + ate → 중심에 한데 모으다 = 집중하다!' },
      { id: 'd1_15', level: 'middle', day: 1, word: 'confident', phonetic: '[ˈkɑːnfɪdənt]', koPron: '컨피던트', pos: 'adj.', meaning: '자신감 있는, 확신하는', subMeanings: ['당당한'], example: 'She felt confident about passing the final exam.', exampleKo: '그녀는 기말고사 합격에 대해 자신감이 있었다.', synonyms: ['assured', 'certain', 'self-reliant'], antonyms: ['anxious', 'doubtful'], derivatives: 'confidence (n) 자신감, 신뢰 / confidential (adj) 기밀의', tip: '혼동 주의: confident(자신감 있는) vs confidential(비밀의, 기밀의)!' },
      { id: 'd1_16', level: 'middle', day: 1, word: 'consume', phonetic: '[kənˈsuːm]', koPron: '컨슘', pos: 'v.', meaning: '소비하다, 섭취하다', subMeanings: ['(시간·에너지를) 소모하다', '다 써버리다'], example: 'Modern electric vehicles consume much less energy.', exampleKo: '현대 전기 자동차는 에너지를 훨씬 덜 소비한다.', synonyms: ['use up', 'expend', 'devour'], antonyms: ['conserve', 'save'], derivatives: 'consumer (n) 소비자 / consumption (n) 소비, 섭취', tip: '명사형 spelling 주의! consume → consumption (p가 들어갑니다).' },
      { id: 'd1_17', level: 'middle', day: 1, word: 'contribute', phonetic: '[kənˈtrɪbjuːt]', koPron: '컨트리뷰트', pos: 'v.', meaning: '기여하다, 공헌하다', subMeanings: ['기부하다', '원인이 되다'], example: 'Every team member contributed to the success of the project.', exampleKo: '모든 팀원이 프로젝트의 성공에 기여했다.', synonyms: ['donate', 'supply', 'lead to'], antonyms: ['hinder', 'detract'], derivatives: 'contribution (n) 기여, 기부 / contributor (n) 기여자', tip: 'contribute to + 명사/동명사 (~에 기여하다, ~의 원인이 되다)에서 to는 전치사!' },
      { id: 'd1_18', level: 'middle', day: 1, word: 'create', phonetic: '[kriˈeɪt]', koPron: '크리에이트', pos: 'v.', meaning: '창조하다, 만들어 내다', subMeanings: ['(감정·인상을) 불러일으키다'], example: 'Artists use colors and shapes to create new worlds.', exampleKo: '예술가들은 새로운 세계를 창조하기 위해 색과 형태를 사용한다.', synonyms: ['invent', 'generate', 'produce'], antonyms: ['destroy', 'ruin'], derivatives: 'creative (adj) 창의적인 / creativity (n) 창의력 / creature (n) 생명체', tip: '파생어 3총사: creative(창의적인), creativity(창의성), creature(생물) 모두 필수!' },
      { id: 'd1_19', level: 'middle', day: 1, word: 'curious', phonetic: '[ˈkjʊriəs]', koPron: '큐리어스', pos: 'adj.', meaning: '호기심이 많은, 궁금한', subMeanings: ['기이한, 별난'], example: 'Curious minds always ask questions about how things work.', exampleKo: '호기심이 많은 사람들은 사물이 어떻게 작동하는지 항상 질문한다.', synonyms: ['inquisitive', 'interested', 'peculiar'], antonyms: ['indifferent', 'uninterested'], derivatives: 'curiosity (n) 호기심 / curiously (adv) 호기심 있게', tip: 'be curious about (~에 대해 궁금해하다) 형태로 독해에 매우 자주 나옵니다.' },
      { id: 'd1_20', level: 'middle', day: 1, word: 'decrease', phonetic: '[dɪˈkriːs]', koPron: '디크리스', pos: 'v./n.', meaning: '감소하다, 줄이다 / 감소', subMeanings: ['하락하다'], example: 'The use of disposable plastic bags has decreased sharply.', exampleKo: '일회용 비닐봉지의 사용량이 급격히 감소했다.', synonyms: ['reduce', 'decline', 'diminish'], antonyms: ['increase', 'expand'], derivatives: 'decreasing (adj) 감소하는', tip: 'de(아래로) + crease(자라다) → 아래로 줄어들다! 반대는 in(안으로) + crease.' },

      // ==================== DAY 2: 중등 필수 완성 ② (20단어) ====================
      { id: 'd2_01', level: 'middle', day: 2, word: 'describe', phonetic: '[dɪˈskraɪb]', koPron: '디스크라이브', pos: 'v.', meaning: '묘사하다, 설명하다', subMeanings: ['특징을 말하다'], example: 'Words cannot fully describe the beauty of the sunrise.', exampleKo: '말로는 그 일출의 아름다움을 온전히 묘사할 수 없다.', synonyms: ['depict', 'portray', 'explain'], antonyms: ['conceal', 'hide'], derivatives: 'description (n) 묘사, 설명 / descriptive (adj) 묘사적인', tip: 'de(아래에) + scribe(쓰다) → 글로 상세히 적어 내려가다 = 묘사하다!' },
      { id: 'd2_02', level: 'middle', day: 2, word: 'determine', phonetic: '[dɪˈtɜːrmɪn]', koPron: '디터민', pos: 'v.', meaning: '결정하다, 결심하다', subMeanings: ['알아내다, 밝히다'], example: 'Your daily habits determine your future success.', exampleKo: '당신의 매일의 습관이 당신의 미래 성공을 결정한다.', synonyms: ['decide', 'resolve', 'establish'], antonyms: ['hesitate', 'waver'], derivatives: 'determination (n) 결심, 투지 / determined (adj) 단호한', tip: 'be determined to V (~하기로 굳게 결심하다)는 고1 내신 서술형 빈출 표현!' },
      { id: 'd2_03', level: 'middle', day: 2, word: 'develop', phonetic: '[dɪˈveləp]', koPron: '디벨롭', pos: 'v.', meaning: '발달하다, 개발하다', subMeanings: ['(병·습관이) 생기다', '(필름을) 현상하다'], example: 'Reading diverse genres helps develop critical thinking skills.', exampleKo: '다양한 장르를 읽는 것은 비판적 사고력을 발달시키는 데 도움이 된다.', synonyms: ['grow', 'advance', 'evolve'], antonyms: ['decline', 'regress'], derivatives: 'development (n) 발달, 개발 / developing (adj) 개발도상국의', tip: 'developing country(개발도상국) vs developed country(선진국) 분사 구분 필수!' },
      { id: 'd2_04', level: 'middle', day: 2, word: 'disappear', phonetic: '[ˌdɪsəˈpɪr]', koPron: '디서피어', pos: 'v.', meaning: '사라지다, 없어지다', subMeanings: ['멸종하다'], example: 'Many endangered species may disappear within a few decades.', exampleKo: '많은 멸종 위기종들이 수십 년 내에 사라질지도 모른다.', synonyms: ['vanish', 'fade'], antonyms: ['appear', 'emerge'], derivatives: 'disappearance (n) 실종, 소멸', tip: '자동사이므로 수동태(be disappeared)로 절대 쓰지 않습니다! 어법 시험 단골!' },
      { id: 'd2_05', level: 'middle', day: 2, word: 'discover', phonetic: '[dɪˈskʌvər]', koPron: '디스커버', pos: 'v.', meaning: '발견하다, 알아내다', subMeanings: ['깨닫다'], example: 'Alexander Fleming discovered penicillin by accident in 1928.', exampleKo: '알렉산더 플레밍은 1928년 우연히 페니실린을 발견했다.', synonyms: ['find', 'uncover', 'detect'], antonyms: ['hide', 'overlook'], derivatives: 'discovery (n) 발견', tip: 'dis(반대/벗기다) + cover(덮개) → 덮개를 벗겨내어 발견하다!' },
      { id: 'd2_06', level: 'middle', day: 2, word: 'effective', phonetic: '[ɪˈfektɪv]', koPron: '이펙티브', pos: 'adj.', meaning: '효과적인, 유효한', subMeanings: ['실질적인'], example: 'Summarizing what you learned is a very effective study method.', exampleKo: '배운 내용을 요약하는 것은 매우 효과적인 공부법이다.', synonyms: ['efficient', 'productive', 'useful'], antonyms: ['ineffective', 'useless'], derivatives: 'effect (n) 효과, 결과 / effectively (adv) 효과적으로', tip: 'effective(효과적인: 결과를 내는) vs efficient(효율적인: 시간·비용을 아끼는).' },
      { id: 'd2_07', level: 'middle', day: 2, word: 'encourage', phonetic: '[ɪnˈkɜːrɪdʒ]', koPron: '인커리지', pos: 'v.', meaning: '격려하다, 장려하다', subMeanings: ['용기를 북돋우다', '촉진하다'], example: 'Good teachers encourage students to think for themselves.', exampleKo: '훌륭한 선생님들은 학생들이 스스로 생각하도록 격려한다.', synonyms: ['inspire', 'motivate', 'promote'], antonyms: ['discourage', 'prevent'], derivatives: 'encouragement (n) 격려 / encouraging (adj) 고무적인', tip: 'en(만들다) + courage(용기) → 용기를 불어넣어 주다! (encourage O to V)' },
      { id: 'd2_08', level: 'middle', day: 2, word: 'environment', phonetic: '[ɪnˈvaɪrənmənt]', koPron: '인바이런먼트', pos: 'n.', meaning: '환경, 주변 상황', subMeanings: ['자연환경'], example: 'A quiet study environment helps improve memory retention.', exampleKo: '조용한 학습 환경은 기억력 유지를 향상시키는 데 도움이 된다.', synonyms: ['surroundings', 'setting', 'habitat'], antonyms: [], derivatives: 'environmental (adj) 환경의 / environmentalist (n) 환경운동가', tip: '철자 주의: 중간에 n이 들어갑니다 (envi-ron-ment).' },
      { id: 'd2_09', level: 'middle', day: 2, word: 'especially', phonetic: '[ɪˈspeʃəli]', koPron: '이스페셜리', pos: 'adv.', meaning: '특히, 특별히', subMeanings: ['유달리'], example: 'English vocabulary is important, especially for high school exams.', exampleKo: '영어 어휘는 특히 고등학교 시험에서 중요하다.', synonyms: ['particularly', 'notably', 'chiefly'], antonyms: ['generally'], derivatives: 'especial (adj) 특별한', tip: '독해 지문에서 especially 뒤에는 필자가 강조하는 핵심 예시가 나옵니다!' },

      { id: 'd2_13', level: 'middle', day: 2, word: 'generation', phonetic: '[ˌdʒenəˈreɪʃn]', koPron: '제너레이션', pos: 'n.', meaning: '세대, 발생', subMeanings: ['(전기 등의) 생산'], example: 'Bridging the gap between generations requires open dialogue.', exampleKo: '세대 간의 격차를 줄이려면 열린 대화가 필요하다.', synonyms: ['age group', 'era', 'creation'], antonyms: [], derivatives: 'generate (v) 발생시키다, 만들어 내다 / generator (n) 발전기', tip: '어근 gen(낳다/생산하다) → 같은 시대에 태어난 사람들 = 세대(generation).' },

      { id: 'd2_17', level: 'middle', day: 2, word: 'independent', phonetic: '[ˌɪndɪˈpendənt]', koPron: '인디펜던트', pos: 'adj.', meaning: '독립적인, 자립심이 강한', subMeanings: ['별개의, 무관한'], example: 'High school requires more independent self-directed learning.', exampleKo: '고등학교에서는 더 독립적인 자기주도 학습이 요구된다.', synonyms: ['autonomous', 'self-reliant', 'free'], antonyms: ['dependent', 'reliant'], derivatives: 'independence (n) 독립, 자립 / independently (adv) 독립적으로', tip: 'depend(의존하다)에 부정 접두사 in-이 붙어 "의존하지 않는 = 독립적인"!' },

      { id: 'd2_20', level: 'middle', day: 2, word: 'instance', phonetic: '[ˈɪnstəns]', koPron: '인스턴스', pos: 'n.', meaning: '사례, 경우', subMeanings: ['실례'], example: 'For instance, learning roots helps you guess unfamiliar words.', exampleKo: '예를 들어, 어근을 배우는 것은 낯선 단어를 추측하는 데 도움이 된다.', synonyms: ['example', 'case', 'illustration'], antonyms: [], derivatives: 'instant (adj) 즉각적인 / instantly (adv) 즉시', tip: 'for instance = for example (예를 들어). 고교 독해 연결어 문제 필수!' },

      { id: 'd3_01', level: 'middle', day: 3, word: 'involve', phonetic: '[ɪnˈvɑːlv]', koPron: '인볼브', pos: 'v.', meaning: '포함하다, 수반하다', subMeanings: ['관련시키다', '참여시키다'], example: 'Success involves hard work, patience, and smart planning.', exampleKo: '성공은 노력, 인내, 그리고 현명한 계획을 수반한다.', synonyms: ['include', 'entail', 'engage'], antonyms: ['exclude'], derivatives: 'involvement (n) 관여, 참여 / involved (adj) 관련된', tip: 'be involved in (~에 관여하다/참여하다) 숙어로 독해에 매우 자주 나옵니다.' },

      { id: 'd3_03', level: 'middle', day: 3, word: 'local', phonetic: '[ˈloʊkl]', koPron: '로컬', pos: 'adj.', meaning: '지역의, 현지의', subMeanings: ['국부적인'], example: 'We visited a local library to research historical documents.', exampleKo: '우리는 역사 문서를 조사하기 위해 지역 도서관을 방문했다.', synonyms: ['regional', 'community', 'native'], antonyms: ['global', 'national'], derivatives: 'locally (adv) 지역적으로 / locate (v) 위치를 찾아내다', tip: 'global(전 세계의)과 정반대 개념으로 대조 지문에 자주 함께 등장합니다.' },

      { id: 'd3_05', level: 'middle', day: 3, word: 'material', phonetic: '[məˈtɪriəl]', koPron: '머티리얼', pos: 'n./adj.', meaning: '재료, 자료 / 물질의', subMeanings: ['직물, 천', '중요한'], example: 'The teacher prepared extra reading material for the class.', exampleKo: '선생님은 수업을 위해 추가 읽기 자료를 준비하셨다.', synonyms: ['substance', 'matter', 'resource'], antonyms: ['spiritual'], derivatives: 'materialize (v) 실현되다 / materialism (n) 물질주의', tip: '독해에서 reading material(읽기 자료), raw material(원자재)로 자주 쓰입니다.' },
      { id: 'd3_06', level: 'middle', day: 3, word: 'mention', phonetic: '[ˈmenʃn]', koPron: '멘션', pos: 'v./n.', meaning: '언급하다 / 언급', subMeanings: ['말하다'], example: 'The article did not mention the exact cause of the accident.', exampleKo: '그 기사는 사고의 정확한 원인을 언급하지 않았다.', synonyms: ['refer to', 'state', 'cite'], antonyms: ['omit', 'ignore'], derivatives: [], tip: '내용 일치/불일치 문제에서 "지문에 언급되지 않은 것(not mentioned)"으로 단골 출제!' },

      { id: 'd3_10', level: 'middle', day: 3, word: 'opportunity', phonetic: '[ˌɑːpərˈtuːnəti]', koPron: '오퍼튜니티', pos: 'n.', meaning: '기회', subMeanings: ['호기'], example: 'Winter break is a great opportunity to master English vocabulary.', exampleKo: '겨울방학은 영어 어휘를 정복할 수 있는 훌륭한 기회이다.', synonyms: ['chance', 'occasion', 'opening'], antonyms: [], derivatives: 'opportune (adj) 시기적절한', tip: 'seize an opportunity(기회를 잡다), miss an opportunity(기회를 놓치다).' },
      { id: 'd3_11', level: 'middle', day: 3, word: 'organize', phonetic: '[ˈɔːrɡənaɪz]', koPron: '오거나이즈', pos: 'v.', meaning: '조직하다, 정리하다', subMeanings: ['체계화하다', '개최하다'], example: 'Organize your notes by topic so you can review easily.', exampleKo: '쉽게 복습할 수 있도록 주제별로 노트를 정리해라.', synonyms: ['arrange', 'structure', 'coordinate'], antonyms: ['scatter', 'disorganize'], derivatives: 'organization (n) 조직, 단체 / organized (adj) 체계적인', tip: 'organ(기관/장기) + ize → 각 기관이 제 역할을 하도록 체계적으로 조직하다!' },

      { id: 'd3_13', level: 'middle', day: 3, word: 'positive', phonetic: '[ˈpɑːzətɪv]', koPron: '파지티브', pos: 'adj.', meaning: '긍정적인, 확신하는', subMeanings: ['양성의', '적극적인'], example: 'Feedback from teachers had a positive impact on my writing.', exampleKo: '선생님들의 피드백은 내 글쓰기에 긍정적인 영향을 주었다.', synonyms: ['optimistic', 'constructive', 'certain'], antonyms: ['negative', 'pessimistic'], derivatives: 'positively (adv) 긍정적으로', tip: '지문의 어조/분위기 파악 문제에서 글쓴이의 태도를 나타낼 때 자주 나옵니다.' },
      { id: 'd3_14', level: 'middle', day: 3, word: 'prefer', phonetic: '[prɪˈfɜːr]', koPron: '프리퍼', pos: 'v.', meaning: '~을 더 좋아하다, 선호하다', subMeanings: ['우선시하다'], example: 'Many students prefer studying in the morning rather than at night.', exampleKo: '많은 학생들이 밤보다는 아침에 공부하는 것을 선호한다.', synonyms: ['favor', 'choose', 'like better'], antonyms: ['dislike', 'reject'], derivatives: 'preference (n) 선호, 기호 / preferable (adj) 더 나은', tip: 'prefer A to B (B보다 A를 더 좋아하다)에서 비교 대상 앞에 than이 아닌 to를 씁니다!' },
      { id: 'd3_15', level: 'middle', day: 3, word: 'prevent', phonetic: '[prɪˈvent]', koPron: '프리벤트', pos: 'v.', meaning: '막다, 예방하다', subMeanings: ['방해하다'], example: 'Proper preparation prevents poor performance on test day.', exampleKo: '철저한 준비는 시험 당일의 저조한 성적을 막아준다.', synonyms: ['stop', 'avoid', 'hinder'], antonyms: ['allow', 'encourage', 'permit'], derivatives: 'prevention (n) 예방 / preventive (adj) 예방의', tip: 'prevent A from -ing (A가 ~하는 것을 막다)는 고1 내신 필수 문형!' },

    ];

    /* ==========================================================================
       2. 클래스카드 핵심 학습 데이터 상태 관리 (암기 / 리콜 / 스펠 진도율)
       ========================================================================== */
    const STORAGE_KEY = 'vocacard_classcard_v1';
    const DAILY_GOAL = 30;

    // wordStatus[wordId] = { memo: 0..4 (0:미학습, 1:모름, 2:헷갈림, 3:앎, 4:완벽함), recall: boolean, spell: boolean, wrongCount: number }
    let state = {
      customWords: [],
      wordStatus: {},
      starredIds: [],
      dailyHistory: {},
      streak: 1,
      lastActiveDate: new Date().toISOString().split('T')[0],
      bestMatchTime: null,
      settings: {
        darkMode: false,
        voiceAccent: 'en-US',
        voiceRate: 1.0,
        showKoPron: true
      }
    };

    // UI 세션 상태
    let ui = {
      view: 'home', // 'home' | 'set'
      activeSetId: 'day_1', // 'day_1'..'day_6' | 'starred' | 'wrong' | 'custom' | 'all'
      setTab: 'list', // 'list' | 'memo' | 'recall' | 'spell' | 'test' | 'matching'
      // 단어장 리스트 가림막 및 검색
      blindMode: 'none', // 'none' | 'word' | 'meaning' | 'pron'
      listSearch: '',
      // 암기(플래시카드) 상태
      cardIndex: 0,
      isFlipped: false,
      clozeExampleMode: false, // 예문 빈칸 훈련 모드
      // 리콜(4지선다 스피드 퀴즈) 상태
      recallIndex: 0,
      recallDirection: 'en2ko', // 'en2ko' | 'ko2en'
      recallOptions: [],
      recallAnswered: false,
      recallSelected: null,
      recallTimeLeft: 100, // % 게이지
      recallTimerId: null,
      recallScore: 0,
      // 스펠(주관식 타이핑) 상태
      spellIndex: 0,
      spellInput: '',
      spellAnswered: false,
      spellCorrect: false,
      spellHintShown: false,
      // 테스트(종합 실전 시험) 상태
      testQueue: [],
      testIndex: 0,
      testAnswers: [],
      testFinished: false,
      // 매칭 게임 상태
      matchCards: [],
      matchSelected: [],
      matchMatchedIds: [],
      matchStartTime: 0,
      matchElapsed: '0.0',
      matchTimerId: null
    };

    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            ...state,
            ...parsed,
            settings: { ...state.settings, ...(parsed.settings || {}) }
          };
        }
        const today = getTodayStr();
        if (state.lastActiveDate !== today) {
          const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
          if (state.lastActiveDate === yesterday && (state.dailyHistory[yesterday] || 0) > 0) {
            state.streak += 1;
          } else {
            state.streak = 1;
          }
          state.lastActiveDate = today;
          saveState();
        }
      } catch (e) {
        console.error(e);
      }
      applyTheme();
      syncHeaderUI();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error(e);
      }
      syncHeaderUI();
    }

    function applyTheme() {
      document.documentElement.classList.toggle('dark', !!state.settings.darkMode);
    }

    function toggleDarkMode() {
      state.settings.darkMode = !state.settings.darkMode;
      applyTheme();
      saveState();
    }

    function toggleKoPron() {
      state.settings.showKoPron = !state.settings.showKoPron;
      saveState();
      syncHeaderUI();
      renderApp();
      showToast(`한글 발음 표기가 ${state.settings.showKoPron ? '켜졌습니다 (ON)' : '숨겨졌습니다 (OFF)'}.`, 'info');
    }

    function setAccent(acc) {
      state.settings.voiceAccent = acc;
      saveState();
      syncHeaderUI();
      showToast(`발음 억양: ${acc === 'en-US' ? '미국식 (US)' : '영국식 (UK)'}`, 'info');
    }

    function toggleRate() {
      state.settings.voiceRate = state.settings.voiceRate === 1.0 ? 0.8 : 1.0;
      saveState();
      syncHeaderUI();
      showToast(`발음 속도: ${state.settings.voiceRate.toFixed(1)}x`, 'info');
    }

    function syncHeaderUI() {
      const todayCount = state.dailyHistory[getTodayStr()] || 0;
      const pct = Math.min(100, Math.round((todayCount / DAILY_GOAL) * 100));
      document.getElementById('hdr-streak').textContent = state.streak;
      document.getElementById('hdr-daily-count').textContent = todayCount;
      document.getElementById('hdr-daily-bar').style.width = `${pct}%`;

      const badge = document.getElementById('hdr-kopron-badge');
      if (badge) {
        badge.textContent = state.settings.showKoPron ? 'ON' : 'OFF';
        badge.className = state.settings.showKoPron
          ? 'px-1.5 py-0.5 rounded bg-indigo-600 text-white text-[10px]'
          : 'px-1.5 py-0.5 rounded bg-slate-400 text-white text-[10px]';
      }

      const btnUs = document.getElementById('btn-us');
      const btnUk = document.getElementById('btn-uk');
      const btnRate = document.getElementById('btn-rate');
      if (btnUs && btnUk && btnRate) {
        if (state.settings.voiceAccent === 'en-US') {
          btnUs.className = 'px-2 py-1 rounded-lg bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-300 shadow-2xs transition';
          btnUk.className = 'px-2 py-1 rounded-lg text-slate-500 dark:text-slate-400 transition';
        } else {
          btnUk.className = 'px-2 py-1 rounded-lg bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-300 shadow-2xs transition';
          btnUs.className = 'px-2 py-1 rounded-lg text-slate-500 dark:text-slate-400 transition';
        }
        btnRate.textContent = `${state.settings.voiceRate.toFixed(1)}x`;
      }
    }

    /* ==========================================================================
       3. 헬퍼 함수 (단어 조회, 진도율 계산, TTS 발음, 토스트)
       ========================================================================== */
    function getAllWords() {
      return [...INITIAL_WORDS, ...state.customWords];
    }

    function getStatus(wordId) {
      return state.wordStatus[wordId] || { memo: 0, recall: false, spell: false, wrongCount: 0 };
    }

    function updateWordStatus(wordId, patch, isWrong = false) {
      const prev = getStatus(wordId);
      state.wordStatus[wordId] = {
        ...prev,
        ...patch,
        wrongCount: isWrong ? (prev.wrongCount + 1) : prev.wrongCount
      };
      if (!isWrong) {
        const today = getTodayStr();
        const before = state.dailyHistory[today] || 0;
        state.dailyHistory[today] = before + 1;
        if (before < DAILY_GOAL && state.dailyHistory[today] >= DAILY_GOAL && typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          showToast('🎉 오늘의 목표 30단어 학습을 달성했습니다!', 'success');
        }
      }
      saveState();
    }

    function getSetWords(setId) {
      const all = getAllWords();
      if (setId.startsWith('day_')) {
        const d = Number(setId.split('_')[1]);
        return all.filter(w => w.day === d);
      }
      if (setId === 'starred') return all.filter(w => state.starredIds.includes(w.id));
      if (setId === 'wrong') return all.filter(w => getStatus(w.id).wrongCount > 0);
      if (setId === 'custom') return state.customWords;
      return all;
    }

    // 세트별 클래스카드 3단계(암기 / 리콜 / 스펠) 달성률 계산
    function getSetProgressStats(words) {
      if (!words || words.length === 0) return { memoPct: 0, recallPct: 0, spellPct: 0, totalPct: 0 };
      const memoDone = words.filter(w => getStatus(w.id).memo >= 3).length;
      const recallDone = words.filter(w => getStatus(w.id).recall).length;
      const spellDone = words.filter(w => getStatus(w.id).spell).length;
      const memoPct = Math.round((memoDone / words.length) * 100);
      const recallPct = Math.round((recallDone / words.length) * 100);
      const spellPct = Math.round((spellDone / words.length) * 100);
      const totalPct = Math.round((memoPct + recallPct + spellPct) / 3);
      return { memoPct, recallPct, spellPct, totalPct };
    }

    function speakText(text, e) {
      if (e) e.stopPropagation();
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = state.settings.voiceAccent;
      utter.rate = state.settings.voiceRate;
      window.speechSynthesis.speak(utter);
    }

    // 발음기호 + 한글 발음 HTML 반환
    function renderPronHTML(w, large = false) {
      const ipa = w.phonetic || '';
      const ko = (state.settings.showKoPron && w.koPron) ? w.koPron : '';
      if (!ipa && !ko) return '';
      if (large) {
        return `
          <div class="flex items-center justify-center gap-2 flex-wrap">
            ${ipa ? `<span class="text-base sm:text-lg font-mono text-slate-400">${ipa}</span>` : ''}
            ${ko ? `<span class="px-3 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/90 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 text-sm sm:text-base font-extrabold">[${ko}]</span>` : ''}
          </div>
        `;
      }
      return `
        <span class="inline-flex items-center gap-1.5 flex-wrap">
          ${ipa ? `<span class="text-xs font-mono text-slate-400">${ipa}</span>` : ''}
          ${ko ? `<span class="text-xs font-extrabold text-indigo-600 dark:text-indigo-400">[${ko}]</span>` : ''}
        </span>
      `;
    }

    function toggleStar(wordId, e) {
      if (e) e.stopPropagation();
      const idx = state.starredIds.indexOf(wordId);
      if (idx === -1) {
        state.starredIds.push(wordId);
        showToast('⭐ 별표 단어장에 저장했습니다.', 'warning');
      } else {
        state.starredIds.splice(idx, 1);
        showToast('별표가 해제되었습니다.', 'info');
      }
      saveState();
      renderApp();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      const bg = {
        info: 'bg-slate-800 text-white',
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-500 text-white',
        error: 'bg-rose-600 text-white'
      }[type];
      el.className = `${bg} px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-bold animate-fade-in pointer-events-auto`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 250);
      }, 2200);
    }

    function clearTimers() {
      if (ui.recallTimerId) { clearInterval(ui.recallTimerId); ui.recallTimerId = null; }
      if (ui.matchTimerId) { clearInterval(ui.matchTimerId); ui.matchTimerId = null; }
    }

    function goHome() {
      clearTimers();
      ui.view = 'home';
      renderApp();
    }

    function openSet(setId, initialTab = 'list') {
      clearTimers();
      ui.view = 'set';
      ui.activeSetId = setId;
      ui.setTab = initialTab;
      ui.cardIndex = 0;
      ui.isFlipped = false;
      ui.recallIndex = 0;
      ui.recallScore = 0;
      ui.spellIndex = 0;
      resetModeSubStates();
      renderApp();
    }

    function switchSetTab(tab) {
      clearTimers();
      ui.setTab = tab;
      ui.isFlipped = false;
      resetModeSubStates();
      renderApp();
    }

    function resetModeSubStates() {
      ui.recallOptions = [];
      ui.recallAnswered = false;
      ui.recallSelected = null;
      ui.spellInput = '';
      ui.spellAnswered = false;
      ui.spellCorrect = false;
      ui.spellHintShown = false;
      ui.testQueue = [];
      ui.testIndex = 0;
      ui.testAnswers = [];
      ui.testFinished = false;
      ui.matchCards = [];
      ui.matchSelected = [];
      ui.matchMatchedIds = [];
    }

    /* ==========================================================================
       4. 메인 라우터
       ========================================================================== */
    function renderApp() {
      const main = document.getElementById('app-main');
      if (ui.view === 'home') {
        renderHomeDashboard(main);
      } else {
        renderSetWorkspace(main);
      }
    }

    /* ==========================================================================
       5. 화면 ①: 클래스카드 세트 라이브러리 홈 대시보드

    function renderHomeDashboard(container) {

                <div class="pt-4 flex items-center justify-between">
                  <span class="text-lg font-black text-rose-600 dark:text-rose-400">${wrongWords.length}단어</span>
                  <span class="text-xs font-bold text-slate-400">복습하기 <i class="fa-solid fa-chevron-right"></i></span>
                </div>
              </div>

              <!-- 별표 즐겨찾기 세트 -->
              <div onclick="openSet('starred', 'memo')" class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 hover:border-amber-400 shadow-xs hover:shadow-md transition cursor-pointer flex flex-col justify-between">
                <div class="space-y-2">
                  <div class="w-11 h-11 rounded-2xl bg-amber-50 dark:bg-amber-950/60 text-amber-500 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-star"></i>
                  </div>
                  <h3 class="font-black text-base text-slate-900 dark:text-white">별표 단어 세트</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">중요 표시한 나만의 핵심 단어 모음</p>
                </div>
                <div class="pt-4 flex items-center justify-between">
                  <span class="text-lg font-black text-amber-500">${starredWords.length}단어</span>

                </div>
              </div>

              <!-- 나만의 단어장 세트 -->
              <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 hover:border-blue-400 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                <div onclick="openSet('custom', 'list')" class="space-y-2 cursor-pointer">
                  <div class="w-11 h-11 rounded-2xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-folder-plus"></i>
                  </div>
                  <h3 class="font-black text-base text-slate-900 dark:text-white">나만의 단어장</h3>

                const stats = getSetProgressStats(words);
                const isMiddle = meta.level === 'middle';

                return `
                  <div onclick="openSet('${meta.id}', 'list')" class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 hover:border-blue-500 dark:hover:border-blue-500 shadow-xs hover:shadow-lg transition cursor-pointer flex flex-col justify-between space-y-4">
                    <div class="space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${isMiddle ? 'bg-blue-50 text-blue-600 dark:bg-blue-950/70 dark:text-blue-300' : 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/70 dark:text-emerald-300'}">
                          ${meta.badge} · 20단어
                        </span>
                        <span class="text-xs font-black text-slate-400">달성 ${stats.totalPct}%</span>
                      </div>
                      <h4 class="text-lg font-black text-slate-900 dark:text-white">${meta.title}</h4>
                      <p class="text-xs text-slate-500 dark:text-slate-400">${meta.desc}</p>
